services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teste_tecnico_sea_app
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/solicitacoes_de_atendimento
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ELASTICSEARCH_URI: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET:-my-secret-key}
    ports:
      - "8080:8080"
    depends_on:
      - postgresql
      - elasticsearch

  postgresql:
    image: postgres:18-alpine
    env_file:
      - .env
    container_name: teste_tecnico_sea
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: solicitacoes_de_atendimento
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ./pg_data:/var/lib/postgresql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: teste_tecnico_sea_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - ${ELASTICSEARCH_PORT}:9200
    volumes:
      - ./es_data:/usr/share/elasticsearch/data
