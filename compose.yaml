services:
  postgresql:
    image: postgres:18-alpine
    env_file:
      - .env
    container_name: teste_tecnico_sea
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: solicitacoes_de_atendimento
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ./pg_data:/var/lib/postgresql
